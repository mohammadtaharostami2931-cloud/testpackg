<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--cd:#fff;--tx:#1b2430;--mu:#6b7684;--bd:#dfe4ea;--hd:#eceff4;--ac:#1d5fd1;--ok:#1f9d55;--wr:#d98a00;--er:#d6403a}

:root[data-theme="dark"]{--bg:#13171c;--cd:#1c2229;--tx:#e6eaf0;--mu:#98a3b1;--bd:#2c353f;--hd:#242d36;--ac:#5b9bff;--ok:#3dc47a;--wr:#f0b03a;--er:#ff6b63}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}.sub{color:var(--mu);font-size:12px}
nav button,.btn{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:6px 14px;border-radius:8px;cursor:pointer}
nav button.on,.btn.pr{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.dg{color:var(--er)}
main{padding:16px 18px;max-width:1500px;margin:auto}.hide{display:none!important}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k,.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.k b{display:block;font-size:22px}.k span{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 10px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar>i{flex:0 0 96px;font-style:normal;direction:ltr;text-align:left}

.sc{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:4px 6px;white-space:nowrap;text-align:center;font-size:12px}
th{background:var(--hd);position:sticky;top:0;z-index:2}
.gt td{padding:5px 8px}.gt td:first-child{text-align:right;font-weight:600}
.pc{min-width:70px;border-radius:4px}
.tl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
#tw{direction:ltr;max-height:68vh;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
#tb input[type=text],#tb input[type=number]{width:96px;border-color:transparent;background:transparent}#tb input:focus{border-color:var(--ac);background:var(--cd)}
#tb input.l{width:190px}#tb input.s{width:60px}
.st{position:sticky;left:0;background:var(--cd);z-index:1}th.st{z-index:3;background:var(--hd)}
.bg{display:inline-block;min-width:22px;padding:0 6px;border-radius:10px;font-size:11px;background:var(--hd)}.bg.o{background:var(--er);color:#fff}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.mb{background:var(--cd);border-radius:14px;max-width:1000px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.mb textarea{width:100%;height:150px;direction:ltr;font-family:monospace;font-size:11px}
#tb td.st:first-child,#th th.st:first-child{min-width:225px!important}#tb td.st:nth-child(2),#th th.st:nth-child(2){left:225px!important}
.dv{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:15;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 28px}.dw{max-width:1000px;margin:auto}
.hero{background:linear-gradient(135deg,#123a7a,#1d5fd1);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.hero .sub{color:#cfe0ff}.hero h1{margin:2px 0 8px}.hp{min-width:240px;flex:1;max-width:360px}.hp .tr{height:12px;background:#ffffff33;border-radius:6px;overflow:hidden;margin:6px 0}.hp .tr u{display:block;height:100%;background:#4ade80}
.pill{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;background:var(--hd);color:var(--tx);margin:0 0 0 4px}.hero .pill{background:#ffffff26;color:#fff}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.cu{background:color-mix(in srgb,var(--wr) 22%,transparent);color:var(--wr)}.pill.no{color:var(--mu)}.pill.er{background:color-mix(in srgb,var(--er) 18%,transparent);color:var(--er)}
.dt{border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:14px}.dt table td,.dt table th{padding:9px 12px;font-size:13px}.dt h2{margin:0;padding:10px 14px;background:var(--hd);border-bottom:1px solid var(--bd)}
.dt .ph{background:var(--hd);font-weight:700;border-inline-start:4px solid var(--ac);text-align:right;width:210px}.dt .ph small{display:block;color:var(--mu);font-weight:400}
.kv td:nth-child(odd){background:var(--hd);color:var(--mu);font-weight:600;width:18%;text-align:right}.kv td:nth-child(even){text-align:right;direction:ltr;font-weight:600}.dd{direction:ltr}

function opts(){const u=i=>[...new Set(S.rows.map(r=>r.v[i]).filter(Boolean))].sort();
$('#fa').innerHTML='<option value="">همه Areaها</option>'+u(3).map(x=>`<option>${esc(x)}</option>`).join('');
$('#fs').innerHTML='<option value="">همه وضعیت‌ها</option>'+u(9).map(x=>`<option>${esc(x)}</option>`).join('');
$('#mo').insertAdjacentHTML('beforebegin','');let dl=document.getElementById('dls');if(dl)dl.remove();
document.body.insertAdjacentHTML('beforeend','<div id="dls">'+[0,2,3,7,8,9].map(i=>`<datalist id="dl${i}">${u(i).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('')+'</div>')}
function filt(){const q=$('#q').value.trim().toLowerCase(),a=$('#fa').value,s=$('#fs').value,o=$('#fo').checked;
return S.rows.filter(r=>(!q||String(r.v[1]).toLowerCase().includes(q))&&(!a||r.v[3]===a)&&(!s||r.v[9]===s)&&(!o||openP(r.id)>0))}
function tbl(){$('#th').innerHTML='<tr><th class="st" style="min-width:104px">عملیات</th>'+COLS.map((c,i)=>`<th ${i==1?'class="st" style="left:104px"':''}>${c}</th>`).join('')+'</tr>';
const F=filt(),mx=Math.max(0,Math.ceil(F.length/PS)-1);pg=Math.min(pg,mx);
$('#cnt').textContent=fa(F.length)+' ردیف';$('#pn').textContent=' صفحه '+fa(pg+1)+' از '+fa(mx+1)+' ';
$('#tb').innerHTML=F.slice(pg*PS,pg*PS+PS).map(r=>{const t=(S.pun[r.id]||[]).length,o=openP(r.id);
return`<tr data-id="${r.id}"><td class="st"><button class="btn pr" data-a="dt">🔍 جزئیات</button> <button class="btn" data-a="pn" title="پانچ‌ها">پانچ <span class="bg ${o?'o':''}">${o}/${t}</span></button> <button class="btn dg" data-a="del">✕</button></td>`+r.v.map((x,i)=>{
if(BI.includes(i))return`<td><input type="checkbox" data-c="${i}" ${x?'checked':''}></td>`;
const l=i==1?'class="l st" style="left:104px;background:var(--cd)"':(i==6?'':'');
const ty=i==6?'number':'text',ls=[0,2,3,7,8,9].includes(i)?` list="dl${i}"`:'';
return`<td ${i==1?'class="st" style="left:104px"':''}><input type="${ty}" ${i==1?'class="l"':(i==0||i==7||i==8?'class="s"':'')} data-c="${i}" value="${esc(x)}"${ls} ${DI.includes(i)?'placeholder="dd-Mmm-yy"':''}></td>`}).join('')+'</tr>'}).join('')}
$('#tb').addEventListener('change',e=>{const el=e.target,tr=el.closest('tr');if(!tr||el.dataset.c===undefined)return;const r=S.rows.find(x=>x.id==tr.dataset.id),c=+el.dataset.c;
r.v[c]=BI.includes(c)?el.checked:(c==6?(+el.value||0):el.value);save()});
$('#tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=+b.closest('tr').dataset.id;
if(b.dataset.a=='dt'){detail(id);return}
if(b.dataset.a=='del'){const r=S.rows.find(x=>x.id==id);if(confirm('ردیف '+r.v[1]+' و پانچ‌های آن حذف شود؟')){S.rows=S.rows.filter(x=>x.id!=id);delete S.pun[id];save();opts();tbl()}}
else punch(id)});
['q','fa','fs','fo'].forEach(i=>$('#'+i).addEventListener('input',()=>{pg=0;tbl()}));
$('#pv').onclick=()=>{pg=Math.max(0,pg-1);tbl()};$('#nx').onclick=()=>{pg++;tbl()};
$('#add').onclick=()=>{const n=prompt('شماره تست پکیج (TP NO) جدید:');if(!n)return;const v=COLS.map((c,i)=>BI.includes(i)?false:(i==6?0:''));v[1]=n.trim();v[0]='AG';S.rows.unshift({id:S.nid++,v});save();opts();pg=0;tbl()};
$('#rs').onclick=()=>{if(confirm('همه ویرایش‌ها و پانچ‌ها پاک و فایل اصلی بازگردانی شود؟')){S=fresh();save();opts();tbl();dash()}};
/* ---------- Punch ---------- */
const CAT=['Mechanical','Piping','Instrument','Electrical','QC / Doc','Safety'],PR=['A','B','C'],PST=['باز','در حال انجام','بسته'];
const sel=(a,v,k)=>`<select data-k="${k}">${a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
function punch(id){const r=S.rows.find(x=>x.id==id);const L=S.pun[id]=S.pun[id]||[];
const draw=()=>{$('#mo').innerHTML=`<div class="md"><div class="mb"><div class="tl"><h2 style="margin:0">پانچ‌های ${esc(r.v[1])}</h2><button class="btn pr" id="pa">+ پانچ جدید</button><button class="btn" id="pc">بستن</button></div><div class="sc"><table><tr><th>#</th><th>شرح پانچ</th><th>دسته</th><th>اولویت</th><th>مسئول</th><th>مهلت</th><th>وضعیت</th><th></th></tr>`+
(L.length?L.map((p,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><input data-k="d" value="${esc(p.d)}" style="width:260px"></td><td>${sel(CAT,p.cat,'cat')}</td><td>${sel(PR,p.pr,'pr')}</td><td><input data-k="who" value="${esc(p.who)}" style="width:110px"></td><td><input type="date" data-k="due" value="${p.due||''}"></td><td>${sel(PST,p.st,'st')}</td><td><button class="btn dg" data-x="1">✕</button></td></tr>`).join(''):'<tr><td colspan="8" class="sub">پانچی ثبت نشده است.</td></tr>')+'</table></div></div></div>';
const m=$('#mo');m.querySelector('#pa').onclick=()=>{L.push({d:'',cat:CAT[0],pr:'B',who:'',due:'',st:'باز'});save();draw()};
m.querySelector('#pc').onclick=()=>{m.innerHTML='';tbl();if(!$('#p').classList.contains('hide'))pall();if(!$('#dv').classList.contains('hide'))detail(id)};
m.querySelector('table').onchange=e=>{const tr=e.target.closest('tr');if(!tr||!e.target.dataset.k)return;L[+tr.dataset.i][e.target.dataset.k]=e.target.value;save()};
m.querySelector('table').onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;if(confirm('این پانچ حذف شود؟')){L.splice(+b.closest('tr').dataset.i,1);save();draw()}}};draw()}
function pall(){const R=S.rows.filter(r=>(S.pun[r.id]||[]).length);let h='<div class="cd"><h2>خلاصه پانچ‌های همه تست پکیج‌ها</h2><div class="sc"><table class="gt"><tr><th>TP NO</th><th>Area</th><th>کل</th><th>باز</th><th>اولویت A باز</th><th></th></tr>';
h+=R.map(r=>{const L=S.pun[r.id];return`<tr><td>${esc(r.v[1])}</td><td>${esc(r.v[3])}</td><td>${L.length}</td><td>${openP(r.id)}</td><td>${L.filter(p=>p.pr=='A'&&p.st!='بسته').length}</td><td><button class="btn" data-pid="${r.id}">مدیریت</button></td></tr>`}).join('')||'<tr><td colspan="6" class="sub">هنوز پانچی ثبت نشده است. از جدول، دکمه «پانچ» هر ردیف را بزنید.</td></tr>';
$('#p').innerHTML=h+'</table></div></div>';$('#p').onclick=e=>{const b=e.target.closest('[data-pid]');if(b)punch(+b.dataset.pid)}}
/* ---------- Detail page ---------- */
function detail(id){const r=S.rows.find(x=>x.id==id);if(!r)return;const v=r.v,dv=$('#dv');
const PH=[['۱. جوشکاری (Iso Weld)',[[10,11]]],['۲. پانچ لیست',[[12,13],[14,15]]],['۳. آماده‌سازی تست',[[16,-1],[17,18]]],['۴. آزمون (Hydrotest)',[[19,20]]],['۵. فعالیت‌های پس از تست',[[21,22],[23,24]]],['۶. تأییدیه نهایی',[[25,26]]]];
const done=ST.filter(s=>v[s[1]]).length,cu=ST.find(s=>!v[s[1]]),ci=cu?cu[1]:-1,pt=pc(done,ST.length);
const val=i=>i==6?fa(v[i]):(esc(v[i])||'—');
const L=S.pun[id]||[],o=openP(id);
let h=`<div class="dw"><div class="tl"><button class="btn pr" id="dc">→ بازگشت به جدول</button><button class="btn" id="dp">مدیریت پانچ‌ها</button></div>
<div class="hero"><div><div class="sub">Test Package</div><h1 dir="ltr" style="font-size:22px">${esc(v[1])}</h1>${[v[9],v[8],v[2],v[3],v[0]].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
<div class="hp"><div>پیشرفت کلی: <b>${pt}٪</b> (${done} از ${ST.length} مرحله)</div><div class="tr"><u style="width:${pt}%"></u></div><div class="sub">${cu?'مرحله جاری: '+cu[0]:'همه مراحل تکمیل شده است'} · پانچ باز: ${o}</div></div></div>
<div class="dt"><h2>اطلاعات عمومی</h2><table class="kv">`+[[1,0],[2,3],[4,5],[6,7],[8,9]].map(p=>`<tr><td>${COLS[p[0]]}</td><td>${val(p[0])}</td><td>${COLS[p[1]]}</td><td>${val(p[1])}</td></tr>`).join('')+`</table></div>
<div class="dt"><h2>مراحل و فعالیت‌ها</h2><table><tr><th>دسته‌بندی</th><th>فعالیت</th><th>وضعیت</th><th>تاریخ</th></tr>`;
PH.forEach(([t,it])=>{const d=it.filter(x=>v[x[0]]).length;it.forEach((x,k)=>{h+='<tr>'+(k?'':`<td class="ph" rowspan="${it.length}">${t}<small>${d} از ${it.length} انجام شده</small></td>`)+`<td dir="ltr">${COLS[x[0]]}</td><td>${v[x[0]]?'<span class="pill ok">✓ انجام شد</span>':(x[0]==ci?'<span class="pill cu">مرحله جاری</span>':'<span class="pill no">انجام نشده</span>')}</td><td class="dd">${x[1]>0?(esc(v[x[1]])||'—'):'—'}</td></tr>`})});
h+=`</table></div><div class="dt"><h2>پانچ‌ها (${L.length} مورد، ${o} باز)</h2>`+(L.length?`<table><tr><th>#</th><th>شرح</th><th>دسته</th><th>اولویت</th><th>مسئول</th><th>مهلت</th><th>وضعیت</th></tr>`+L.map((p,i)=>`<tr><td>${i+1}</td><td style="text-align:right">${esc(p.d)||'—'}</td><td>${esc(p.cat)}</td><td>${p.pr}</td><td>${esc(p.who)||'—'}</td><td class="dd">${p.due||'—'}</td><td><span class="pill ${p.st=='بسته'?'ok':(p.st=='باز'?'er':'cu')}">${p.st}</span></td></tr>`).join('')+'</table>':'<div class="sub" style="padding:14px">پانچی برای این تست پکیج ثبت نشده است.</div>')+'</div></div>';
dv.innerHTML=h;dv.classList.remove('hide');dv.scrollTop=0;
$('#dc').onclick=()=>{dv.classList.add('hide');dv.innerHTML=''};$('#dp').onclick=()=>punch(id)}
/* ---------- Export & tabs ---------- */
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
$('#ex').onclick=()=>{const a=[COLS.map(q).join(',')].concat(S.rows.map(r=>r.v.map((x,i)=>BI.includes(i)?(x?'TRUE':'FALSE'):q(x)).join(',')));
const p=['TP NO,Description,Category,Priority,Responsible,Due,Status'];S.rows.forEach(r=>(S.pun[r.id]||[]).forEach(x=>p.push([r.v[1],x.d,x.cat,x.pr,x.who,x.due,x.st].map(q).join(','))));
$('#mo').innerHTML=`<div class="md"><div class="mb"><h2>جدول تست پکیج (CSV) – کپی کنید و در Excel بچسبانید</h2><textarea readonly>${esc(a.join('\n'))}</textarea><h2>پانچ‌ها (CSV)</h2><textarea readonly>${esc(p.join('\n'))}</textarea><button class="btn pr" id="cl">بستن</button></div></div>`;
$('#cl').onclick=()=>$('#mo').innerHTML='';document.querySelectorAll('#mo textarea').forEach(t=>t.onfocus=()=>t.select())};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));['d','t','p'].forEach(i=>$('#'+i).classList.toggle('hide',i!=b.dataset.t));
if(b.dataset.t=='d')dash();if(b.dataset.t=='t')tbl();if(b.dataset.t=='p')pall()});
opts();dash();
</script></body></html>
